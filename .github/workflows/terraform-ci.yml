jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Select Workspace
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: |
          ENV=$([[ "${{ github.base_ref }}" == "main" ]] && echo "prod" || echo "dev")
          terraform workspace select $ENV || terraform workspace new $ENV

      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: terraform plan -out=tfplan.bin -no-color

      # ← שומר את קובץ ה-plan
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan.bin

  apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Workspace
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: |
          ENV=$([[ "${{ github.ref_name }}" == "main" ]] && echo "prod" || echo "dev")
          terraform workspace select $ENV || terraform workspace new $ENV

      # ← מוריד את קובץ ה-plan שנשמר
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: terraform apply -auto-approve tfplan.bin