name: Terraform Pipeline

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev, main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{secrets.SA}}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format & Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: terraform plan -out=tfplan.bin -no-color

      # 1. בראנץ' DEV - רץ אוטומטית מיד אחרי המיזוג (Push)
      - name: Terraform Apply to DEV (Automatic)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.check.outputs.destroy == 'false'
        run: terraform apply -auto-approve tfplan.bin

      # 2. בראנץ' MAIN - ירוץ אך ורק אם לחצת על הכפתור הידני ב-GitHub (Workflow Dispatch)
      - name: Terraform Apply to MAIN (Manual Approval)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan.bin