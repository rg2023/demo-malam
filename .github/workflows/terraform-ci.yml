name: Terraform Pipeline

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Init & Validate
  # ─────────────────────────────────────────
  terraform-init:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4                          # ✅ חייב להיות

      - name: Authenticate to Google Cloud                 # ✅ חייב להיות
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

  # ─────────────────────────────────────────
  # JOB 2 — Plan
  # ─────────────────────────────────────────
  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform-init                                  # ✅ שם נכון
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Clear Stale Lock
        continue-on-error: true
        run: |
          LOCK_ID=$(gsutil cat gs://demo-malam/state/default.tflock 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ID'])" 2>/dev/null || echo "")
          if [ -n "$LOCK_ID" ]; then
            echo "Stale lock: $LOCK_ID — unlocking..."
            terraform force-unlock -force "$LOCK_ID"
          fi

      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
        run: terraform plan -out=tfplan.bin -no-color

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./terraform/tfplan.bin
          retention-days: 1

